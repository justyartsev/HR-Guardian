server
{
  listen 80;

  # Лимит размера загружаемых файлов (документы до 50MB)
  client_max_body_size 50M;

  # Увеличиваем буферы для больших файлов (JS bundle ~500KB)
  proxy_buffering on;
  proxy_buffer_size 4k;
  proxy_buffers 8 512k;
  proxy_busy_buffers_size 512k;

  location / {
    proxy_pass http://frontend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # WebSocket и SSE для уведомлений
  location /ws/ {
    proxy_pass http://backend:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # Internal API для RAG callbacks (без /api/ prefix)
  location /internal/ {
    proxy_pass http://backend:8000/internal/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # RAG API (для стриминга ответов через SSE)
  location /rag/ {
    proxy_pass http://rag:9000/rag/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # SSE требует отключения буферизации и кэширования
    proxy_buffering off;
    proxy_cache off;

    # Увеличиваем таймауты для долгих генераций (до 30 минут)
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    # Поддержка chunked transfer encoding для SSE
    proxy_set_header Connection "";
    chunked_transfer_encoding on;
  }

  location /ollama/ {
    proxy_pass http://ollama:11434/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

}